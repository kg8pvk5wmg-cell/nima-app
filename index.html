<style>
:root{
  --pink:#d61f7a;
  --pink-deep:#8a0f52;
  --pink-soft:#fce8f1;
  --blush:#fdf7fa;
  --gold:#c9982c;
  --ink:#221820;
  --paper:#ffffff;
  --line:#f0dde8;
  --ok:#3f8a55;
  --warn:#b5651d;
  --danger:#c23b3b;
  --muted:#93808c;
  --r-lg:20px;
  --r-md:14px;
  --r-sm:10px;
  --r-pill:999px;
  --shadow-float:0 8px 24px rgba(138,15,82,0.16);
}
*{box-sizing:border-box;}
body{
  margin:0;
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  background:var(--blush);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
}
.sans{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;}
.display{font-family:'Fraunces',Georgia,serif;}

header.top{
  background:#d6007a;
  color:#fff;
  padding:14px 18px;
  position:sticky;top:0;z-index:20;
  border-bottom:1px solid #b5005f;
}
header.top .brand{
  display:flex;align-items:center;justify-content:flex-start;gap:11px;flex-wrap:wrap;
}
header.top .logo-img{
  width:42px;height:42px;border-radius:50%;object-fit:cover;
  border:2px solid rgba(255,255,255,0.6);flex-shrink:0;background:#fff;
}
header.top h1{
  margin:0;font-size:19px;font-weight:500;letter-spacing:0.1px;color:#fff;
  font-family:'Fraunces',Georgia,serif;
}
header.top h1 em{font-style:italic;color:#ffe08a;font-weight:500;}
header.top .sub{font-family:'Inter',sans-serif;font-size:11.5px;color:#ffd7ec;margin-top:1px;}

main{max-width:760px;margin:0 auto;padding:18px 16px 96px;}
@keyframes fadeSlideIn{
  from{opacity:0;transform:translateY(6px);}
  to{opacity:1;transform:translateY(0);}
}
main.enter{animation:fadeSlideIn 0.28s ease-out;}

h2.section-title{
  font-family:'Fraunces',Georgia,serif;
  font-size:19px;font-weight:500;margin:26px 0 12px;color:var(--pink-deep);
  padding-bottom:0;
}
h2.section-title:first-child{margin-top:4px;}

.card{
  background:var(--paper);border:1px solid var(--line);border-radius:var(--r-md);
  padding:16px;margin-bottom:12px;
}
.field{margin-bottom:12px;}
.field label{display:block;font-size:12px;font-weight:500;color:var(--muted);margin-bottom:5px;}
select,input[type=text],input[type=tel],input[type=date],input[type=time],input[type=password],input[type=number],textarea{
  width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:var(--r-sm);
  font-family:'Inter',sans-serif;font-size:14.5px;background:var(--blush);color:var(--ink);
}
select:focus,input:focus,textarea:focus{outline:2px solid var(--pink);outline-offset:1px;}
textarea{resize:vertical;min-height:60px;}

button.btn{
  font-family:'Inter',sans-serif;font-weight:600;
  background:var(--pink);color:#fff;border:none;padding:11px 18px;border-radius:var(--r-pill);
  font-size:14px;cursor:pointer;letter-spacing:0.1px;transition:background 0.15s, transform 0.1s;
}
button.btn:hover{background:var(--pink-deep);}
button.btn:active{transform:scale(0.97);}
button.btn.ghost{background:none;color:var(--pink);border:1.5px solid var(--pink);}
button.btn.ghost:hover{background:var(--pink-soft);}
button.btn.small{padding:7px 13px;font-size:12.5px;}
button.btn.danger{background:var(--danger);}
button.btn:disabled{background:#d9cdd3;cursor:not-allowed;}
a.btn{display:inline-block;text-decoration:none;}

.slot-grid{display:flex;flex-wrap:wrap;gap:8px;}
.slot{
  font-family:'Inter',sans-serif;font-weight:500;
  border:1.5px solid var(--pink-soft);color:var(--pink-deep);padding:8px 13px;border-radius:var(--r-pill);
  font-size:13.5px;cursor:pointer;background:#fff;transition:all 0.12s;
}
.slot:hover{border-color:var(--pink);}
.slot.selected{background:var(--pink);color:#fff;border-color:var(--pink);}
.slot.taken{opacity:0.35;text-decoration:line-through;cursor:not-allowed;border-color:#eee;color:#aaa;}

.appt{
  border:1px solid var(--line);border-left:4px solid var(--pink);border-radius:var(--r-md);
  padding:12px 14px;margin-bottom:10px;background:var(--paper);
}
.appt.stato-Completato{border-left-color:var(--ok);}
.appt.stato-Annullato{border-left-color:var(--muted);opacity:0.7;}
.appt.stato-NoShow{border-left-color:var(--danger);}
.appt-row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;}
.appt-meta{font-size:12px;color:var(--muted);margin-top:3px;}

.badge{
  font-family:'Inter',sans-serif;font-weight:600;
  font-size:10.5px;padding:3px 9px;border-radius:var(--r-pill);background:var(--pink);color:#fff;letter-spacing:0.2px;
}
.badge.ok{background:var(--ok);}
.badge.muted{background:var(--muted);}
.badge.danger{background:var(--danger);}
.badge.warn{background:var(--warn);}

.actions-row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;}

.notice{
  background:#fbf1de;border:1px solid var(--gold);color:#6b4d1e;font-size:12.5px;
  padding:10px 13px;border-radius:var(--r-sm);margin-bottom:14px;
}
.notice.soft{background:#f4eef1;border-color:var(--line);color:var(--muted);}

.cal-trigger{
  width:100%;padding:11px 14px;border:1.5px solid var(--line);border-radius:var(--r-sm);
  background:var(--paper);cursor:pointer;font-size:14.5px;color:var(--ink);
  display:flex;align-items:center;justify-content:space-between;gap:8px;box-sizing:border-box;
}
.cal-trigger:hover{border-color:var(--pink);}
.cal-trigger.placeholder{color:var(--muted);}
.cal-trigger .cal-icon{color:var(--pink);flex-shrink:0;}
.cal-overlay{
  position:fixed;inset:0;background:rgba(40,20,30,0.45);z-index:200;
  display:flex;align-items:center;justify-content:center;padding:20px;
}
.cal-popup{
  background:var(--paper);border-radius:var(--r-lg);box-shadow:var(--shadow-float);
  width:100%;max-width:360px;padding:22px;
}
.cal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
.cal-titolo{font-family:'Fraunces',Georgia,serif;font-size:19px;color:var(--ink);text-transform:capitalize;}
.cal-nav{
  background:var(--pink-soft);border:none;border-radius:50%;width:36px;height:36px;
  font-size:19px;color:var(--pink-deep);cursor:pointer;display:flex;align-items:center;justify-content:center;
}
.cal-nav:hover{background:var(--pink);color:#fff;}
.cal-weekdays{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:11.5px;color:var(--muted);margin-bottom:8px;font-weight:600;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;}
.cal-day{
  aspect-ratio:1;display:flex;align-items:center;justify-content:center;
  border-radius:50%;font-size:14.5px;color:var(--ink);cursor:pointer;
}
.cal-day:hover:not(.disabled):not(.empty){background:var(--pink-soft);}
.cal-day.disabled{color:var(--line);cursor:not-allowed;}
.cal-day.empty{cursor:default;}
.cal-day.today{border:1.5px solid var(--pink);font-weight:600;}
.cal-day.selected{background:var(--pink);color:#fff;font-weight:600;}
.cal-footer{margin-top:14px;text-align:right;}
.empty{color:var(--muted);font-size:13.5px;padding:24px 4px;text-align:center;}

.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.stat{background:var(--paper);border:1px solid var(--line);padding:14px;border-radius:var(--r-md);}
.stat .num{font-family:'Fraunces',Georgia,serif;font-size:24px;color:var(--pink-deep);}
.stat .lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:0.4px;margin-top:2px;}

.tabbar{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap;}
.tabbar button{
  font-family:'Inter',sans-serif;font-weight:500;
  background:var(--pink-soft);border:1px solid transparent;color:var(--pink-deep);padding:8px 14px;border-radius:var(--r-pill);font-size:12.5px;cursor:pointer;
}
.tabbar button.active{background:var(--pink-deep);color:#fff;}

table.simple{width:100%;border-collapse:collapse;font-size:13px;}
table.simple th,table.simple td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);}
table.simple th{color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:0.3px;}

.pill-select{display:flex;flex-wrap:wrap;gap:8px;}
.pill{
  font-family:'Inter',sans-serif;font-weight:500;
  border:1.5px solid var(--line);padding:9px 15px;border-radius:var(--r-pill);font-size:13px;cursor:pointer;background:#fff;transition:all 0.12s;
}
.pill:hover{border-color:var(--pink);}
.pill.selected{background:var(--pink);color:#fff;border-color:var(--pink);}

.svc-select{position:relative;}
.svc-select-trigger{
  width:100%;padding:11px 14px;border:1.5px solid var(--line);border-radius:var(--r-md);
  background:var(--paper);display:flex;align-items:center;justify-content:space-between;gap:10px;
  cursor:pointer;transition:border-color 0.15s, box-shadow 0.15s;
}
.svc-select-trigger:hover{border-color:var(--pink);}
.svc-select.open .svc-select-trigger{border-color:var(--pink);box-shadow:0 0 0 3px var(--pink-soft);}
.svc-select-trigger .placeholder{color:var(--muted);font-size:14.5px;}
.svc-select-trigger .chosen{display:flex;flex-direction:column;gap:1px;min-width:0;}
.svc-select-trigger .chosen .nome{font-family:'Fraunces',Georgia,serif;font-size:15.5px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.svc-select-trigger .chosen .dettagli{font-size:12px;color:var(--pink-deep);}
.svc-select-trigger .chev{flex-shrink:0;color:var(--pink);transition:transform 0.2s ease;}
.svc-select.open .svc-select-trigger .chev{transform:rotate(180deg);}
.svc-panel{
  position:absolute;top:calc(100% + 6px);left:0;right:0;z-index:30;
  background:var(--paper);border:1px solid var(--line);border-radius:var(--r-md);
  box-shadow:var(--shadow-float);max-height:320px;overflow-y:auto;padding:6px;
  animation:svcPanelIn 0.12s ease-out;
}
@keyframes svcPanelIn{from{opacity:0;transform:translateY(-4px);}to{opacity:1;transform:translateY(0);}}
.svc-hint{font-size:11.5px;color:var(--muted);padding:2px 10px 8px;line-height:1.4;}
.svc-cat-label{
  font-family:'Fraunces',Georgia,serif;font-style:italic;font-size:12.5px;color:var(--pink-deep);
  padding:10px 10px 5px;
}
.svc-opt{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:10px 10px;border-radius:var(--r-sm);cursor:pointer;transition:background 0.12s;
}
.svc-opt:hover{background:var(--pink-soft);}
.svc-opt.selected{background:var(--pink-soft);}
.svc-opt .nome{font-size:14.5px;color:var(--ink);}
.svc-opt .prezzo{font-size:12.5px;color:var(--pink-deep);font-weight:600;white-space:nowrap;flex-shrink:0;}

.cli-select{position:relative;}
.cli-select-trigger{
  width:100%;padding:11px 14px;border:1.5px solid var(--line);border-radius:var(--r-md);
  background:var(--paper);display:flex;align-items:center;justify-content:space-between;gap:10px;
  cursor:pointer;transition:border-color 0.15s, box-shadow 0.15s;
}
.cli-select-trigger:hover{border-color:var(--pink);}
.cli-select.open .cli-select-trigger{border-color:var(--pink);box-shadow:0 0 0 3px var(--pink-soft);}
.cli-select-trigger .placeholder{color:var(--muted);font-size:14.5px;}
.cli-select-trigger .chosen{display:flex;flex-direction:column;gap:1px;min-width:0;}
.cli-select-trigger .chosen .nome{font-family:'Fraunces',Georgia,serif;font-size:15.5px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cli-select-trigger .chosen .dettagli{font-size:12px;color:var(--pink-deep);}
.cli-select-trigger .chev{flex-shrink:0;color:var(--pink);transition:transform 0.2s ease;}
.cli-select.open .cli-select-trigger .chev{transform:rotate(180deg);}
.cli-panel{
  position:absolute;top:calc(100% + 6px);left:0;right:0;z-index:30;
  background:var(--paper);border:1px solid var(--line);border-radius:var(--r-md);
  box-shadow:var(--shadow-float);padding:8px;
  animation:svcPanelIn 0.12s ease-out;
}
.cli-search-input{
  width:100%;padding:9px 12px;border:1.5px solid var(--line);border-radius:var(--r-sm);
  font-size:14.5px;margin-bottom:6px;box-sizing:border-box;font-family:inherit;
}
.cli-search-input:focus{outline:none;border-color:var(--pink);}
.cli-opts-list{max-height:260px;overflow-y:auto;}
.cli-opt{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:10px 10px;border-radius:var(--r-sm);cursor:pointer;transition:background 0.12s;
}
.cli-opt:hover{background:var(--pink-soft);}
.cli-opt.selected{background:var(--pink-soft);}
.cli-opt .nome{font-size:14.5px;color:var(--ink);}
.cli-opt .tel{font-size:12.5px;color:var(--pink-deep);font-weight:600;white-space:nowrap;flex-shrink:0;}
.cli-opt-empty{padding:14px 10px;text-align:center;color:var(--muted);font-size:13.5px;}

.log-line{font-size:12px;color:var(--muted);padding:6px 0;border-bottom:1px dashed var(--line);}

.warn-box{
  background:#fbeee4;border:1px solid var(--warn);color:#7a3512;font-size:12px;padding:9px 11px;border-radius:var(--r-sm);margin-top:7px;
}

footer.disclaimer{
  max-width:760px;margin:24px auto 100px;padding:0 16px;
  font-size:11px;color:var(--muted);line-height:1.6;
}
footer.disclaimer .footer-links{margin-top:5px;}
footer.disclaimer .footer-links button{
  background:none;border:none;padding:0;margin-right:10px;
  font-size:11px;color:var(--muted);text-decoration:underline;cursor:pointer;font-family:inherit;
}
footer.disclaimer .footer-links button:hover{color:var(--pink-deep);}
.pagina-legale h3{font-family:'Fraunces',Georgia,serif;font-size:16px;color:var(--pink-deep);margin:20px 0 6px;}
.pagina-legale h3:first-of-type{margin-top:4px;}
.pagina-legale p{font-size:13.5px;line-height:1.6;color:var(--ink);margin:0 0 10px;}
.pagina-legale ul{margin:0 0 10px;padding-left:20px;}
.pagina-legale li{font-size:13.5px;line-height:1.6;color:var(--ink);margin-bottom:4px;}

nav.bottomnav{
  position:fixed;left:0;right:0;bottom:0;z-index:30;
  background:var(--paper);border-top:1px solid var(--line);
  display:flex;justify-content:space-around;align-items:center;
  padding:8px 6px calc(8px + env(safe-area-inset-bottom));
  box-shadow:var(--shadow-float);
}
nav.bottomnav button{
  font-family:'Inter',sans-serif;
  background:none;border:none;color:var(--muted);font-size:11px;font-weight:500;
  display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:5px 14px;cursor:pointer;border-radius:var(--r-sm);flex:1;max-width:130px;
}
nav.bottomnav button svg{width:22px;height:22px;stroke:var(--muted);fill:none;stroke-width:1.8;transition:stroke 0.15s;}
nav.bottomnav button.active{color:var(--pink-deep);}
nav.bottomnav button.active svg{stroke:var(--pink-deep);}
</style>

<body>

  return ORARI[giorno] || null;
}

function orarioEsteso(dataISO){
  const fasce = orarioDisponibile(dataISO);
  if(!fasce || !fasce.length) return null;
  return [[fasce[0][0], fasce[fasce.length-1][1]]]; // un'unica fascia continua, senza pausa pranzo
}

function slotDaFasce(fasce, durataMin){
  if(!fasce) return [];
  const slots = [];
  fasce.forEach(([inizio,fine])=>{
    let [h,m] = inizio.split(":").map(Number);
    const [hf,mf] = fine.split(":").map(Number);
    let cur = h*60+m;
    const end = hf*60+mf;
    while(cur + durataMin <= end){
      const hh = String(Math.floor(cur/60)).padStart(2,"0");
      const mm = String(cur%60).padStart(2,"0");
      slots.push(`${hh}:${mm}`);
      cur += 15; // slot ogni 15 minuti
    }
  });
  return slots;
}

function generaSlot(dataISO, durataMin){
  return slotDaFasce(orarioDisponibile(dataISO), durataMin);
}

function generaSlotEsteso(dataISO, durataMin){
  return slotDaFasce(orarioEsteso(dataISO), durataMin);
}

function offsetSettimanaPerData(dataISO){
  const lunediDi = (date)=>{
    const giorno = date.getDay();
    const diff = giorno===0 ? -6 : 1-giorno;
    const l = new Date(date);
    l.setDate(date.getDate()+diff);
    l.setHours(0,0,0,0);
    return l;
  };
  const lunediOggi = lunediDi(new Date());
  const lunediScelto = lunediDi(new Date(dataISO+"T00:00:00"));
  return Math.round((lunediScelto - lunediOggi) / (7*24*60*60*1000));
}

function slotOccupato(proId, dataISO, ora, durataMin, escludiApptId){
  const inizioNuovo = timeToMin(ora);
  const fineNuovo = inizioNuovo + durataMin;
  return DB.appts.some(a=>{
    if(a.id===escludiApptId) return false;
    if(a.proId!==proId || a.data!==dataISO) return false;
    if(a.stato==="Annullato") return false;
    const s = serviziAppt(a);
    const inizioA = timeToMin(a.ora);
    const fineA = inizioA + (s.length ? durataTotale(s) : 30);
    return inizioNuovo < fineA && fineNuovo > inizioA;
  });
}
function timeToMin(t){ const [h,m]=t.split(":").map(Number); return h*60+m; }

function aggiornaStatiAutomatici(){
  const oraAttuale = new Date();
  DB.appts.forEach(a=>{
    if(a.stato!=="Confermato") return;
    const s = serviziAppt(a);
    const durata = s.length ? durataTotale(s) : 30;
    const fine = new Date(a.data+"T"+a.ora+":00");
    fine.setMinutes(fine.getMinutes()+durata+10); // margine tecnico 10 min
    if(oraAttuale > fine){ a.stato = "Completato"; verificaBonusReferral(a); }
  });
  verificaCompleanni();
}

function verificaCompleanni(){
  const oggi = new Date();
  const meseOggi = oggi.getMonth()+1, giornoOggi = oggi.getDate(), annoOggi = oggi.getFullYear();
  (DB.clients||[]).forEach(c=>{
    if(!c.dataNascita) return;
    const parti = c.dataNascita.split('-').map(Number);
    const m = parti[1], g = parti[2];
    if(m===meseOggi && g===giornoOggi && c.ultimoAnnoCompleannoBonus!==annoOggi){
      c.punti = (c.punti||0) + PUNTI_COMPLEANNO;
      c.ultimoAnnoCompleannoBonus = annoOggi;
      log(`+${PUNTI_COMPLEANNO} punti compleanno a ${c.nome} 🎂`);

  });
}

function verificaBonusReferral(a){
  if(a.ospite) return; // gli ospiti non hanno un account cliente
  const cliente = DB.clients.find(c=>c.id===a.clienteId);
  if(!cliente || !cliente.riferitoDa || cliente.puntiReferralAssegnati) return;
  const completatiPrecedenti = DB.appts.filter(x=>x.clienteId===cliente.id && x.stato==="Completato" && x.id!==a.id);
  if(completatiPrecedenti.length>0) return; // non è il primo appuntamento completato
  const referrer = DB.clients.find(c=>c.id===cliente.riferitoDa);
  if(!referrer) return;
  referrer.punti = (referrer.punti||0) + PUNTI_REFERRAL;
  cliente.puntiReferralAssegnati = true;
  log(`+${PUNTI_REFERRAL} punti referral a ${referrer.nome} per aver portato ${cliente.nome}`);
}

function badgeClass(stato){
  if(stato==="Completato") return "ok";
  if(stato==="Annullato") return "muted";
  if(stato==="No-show") return "danger";
  return "";
}
function describePagamento(a){
  if(a.pagamento && a.pagamento.tipo==="online" && a.pagamento.stato==="confermato"){
    return `incassato${a.pagamento.metodo?` — ${a.pagamento.metodo}`:' — SumUp online'} (€${a.pagamento.importo})`;
  }
  if(a.pagamento && a.pagamento.tipo==="acconto" && a.pagamento.stato==="confermato"){
    return `acconto €${a.pagamento.importo} incassato${a.pagamento.metodo?` — ${a.pagamento.metodo}`:' — SumUp online'} — saldo ${a.pagatoManuale?'pagato in negozio':'da pagare in negozio'}`;
  }
  if(a.pagamento && a.pagamento.stato==="fallito"){
    return a.pagatoManuale ? "pagato in negozio (il pagamento online non era andato a buon fine)" : "pagamento online non riuscito — da incassare in negozio";
  }
  if(a.pagamento && a.pagamento.stato==="in_attesa"){
    return a.pagatoManuale ? "pagato in negozio (pagamento online mai completato)" : "pagamento online in sospeso";
  }
  return a.pagatoManuale ? "pagato in negozio" : "non pagato";
}
function serveConfermaManuale(a){
  return !(a.pagamento && a.pagamento.tipo==="online" && a.pagamento.stato==="confermato");
}

function apptCompletamentePagato(a){
  if(a.pagamento && a.pagamento.tipo==="online" && a.pagamento.stato==="confermato") return true;
  if(a.pagamento && a.pagamento.tipo==="acconto" && a.pagamento.stato==="confermato") return !!a.pagatoManuale;
  return !!a.pagatoManuale; // nessun pagamento online, oppure fallito/in sospeso ma confermato a mano
}

function sincronizzaPuntiFedelta(a){
  if(a.ospite) return; // gli ospiti non hanno un account cliente su cui accumulare punti
  const cliente = DB.clients.find(c=>c.id===a.clienteId);
  const servizi = serviziAppt(a);
  if(!cliente || !servizi.length) return;
  const completo = apptCompletamentePagato(a);
  const prezzoBase = (a.promoId && a.prezzoPromo!=null) ? a.prezzoPromo : prezzoTotale(servizi);
  const promoObj = a.promoId ? (DB.promo||[]).find(p=>p.id===a.promoId) : null;
  const moltiplicatore = promoObj ? (promoObj.moltiplicatorePunti||1) : 1;
  const punti = Math.floor(prezzoBase * PUNTI_PER_EURO * moltiplicatore);
  if(completo && !a.puntiAssegnati){
    cliente.punti = (cliente.punti||0) + punti;
    a.puntiAssegnati = true;
    if(punti>0) log(`+${punti} punti fedeltà a ${cliente.nome} (${nomiServizi(servizi)} del ${a.data})`);
  } else if(!completo && a.puntiAssegnati){
    cliente.punti = Math.max(0, (cliente.punti||0) - punti);
    a.puntiAssegnati = false;
  }
}

}

function getGiorniSettimana(offset){
  const oggiDate = new Date();
  const giornoSett = oggiDate.getDay(); // 0=Dom..6=Sab
  const diffLunedi = giornoSett===0 ? -6 : 1-giornoSett;
  const lunedi = new Date(oggiDate);
  lunedi.setDate(oggiDate.getDate()+diffLunedi+(offset*7));
  const giorni = [];
  for(let i=1;i<=5;i++){ // Martedì(1) a Sabato(5), giorni di apertura del salone
    const d = new Date(lunedi);
    d.setDate(lunedi.getDate()+i);
    giorni.push(dataLocaleISO(d));
  }
  return giorni;
}

function clientiFiltrati(query){
  const ordinati = DB.clients.slice().sort((a,b)=>a.nome.localeCompare(b.nome));
  const q = (query||"").trim().toLowerCase();
  if(!q) return ordinati;
  const qDigits = q.replace(/\D/g,'');
  return ordinati.filter(c=>{
    const nomeMatch = c.nome.toLowerCase().includes(q);
    const telMatch = qDigits.length>0 && c.telefono.replace(/\D/g,'').includes(qDigits);
    return nomeMatch || telMatch;
  });
}

function confermaPrenotazioneInterna(){
  const sb = staffBooking;
  const servizi = getServizi(sb.serviceIds);
  const durataComplessiva = durataTotale(servizi);
  const prezzoComplessivo = prezzoTotale(servizi);

  let clienteId = null, ospite = null, nomeVisualizzato;
  if(sb.clienteMode==="esistente"){
    if(!sb.clienteId){ alert("Seleziona una cliente."); return; }
    clienteId = sb.clienteId;
    const clienteEsistente = DB.clients.find(c=>c.id===clienteId);
    nomeVisualizzato = clienteEsistente ? clienteEsistente.nome : "Cliente";
  } else {
    const nome = sb.nome.trim(), telefono = sb.telefono.trim(), email = (sb.email||"").trim();
    if(!nome){ alert("Inserisci almeno il nome della cliente."); return; }
    ospite = {nome, telefono, email};
    nomeVisualizzato = nome;
  }

  if(slotOccupato(sb.proId, sb.data, sb.ora, durataComplessiva, null)){
    alert("Questo orario è appena stato occupato, scegline un altro.");
    render();
    return;
  }

  let pagamento = null;
  const metodoMap = {
    online_sumup:{tipo:"online", metodo:"SumUp POS"},
    online_contanti:{tipo:"online", metodo:"Contanti"},
    acconto_sumup:{tipo:"acconto", metodo:"SumUp POS"},
    acconto_contanti:{tipo:"acconto", metodo:"Contanti"},
  };
  if(sb.pagamentoScelta!=="negozio"){
    const m = metodoMap[sb.pagamentoScelta];
    pagamento = {tipo:m.tipo, metodo:m.metodo, importo: m.tipo==="acconto" ? calcolaAcconto(prezzoComplessivo) : prezzoComplessivo, stato:"confermato"};
  }

  const creatoDa = sb.scope.kind==="admin" ? "Admin" : ((getPro(sb.scope.proId)||{}).nome || "Staff");
  const appt = {
    id: uid("a"), clienteId, ospite, area: sb.area, serviceId: sb.serviceIds[0], serviceIds: sb.serviceIds.slice(), proId: sb.proId,
    data: sb.data, ora: sb.ora, stato: "Confermato", pagamento, creato: adessoISO(),
    inseritoDaStaff: true, creatoDa
  };
  DB.appts.push(appt);
  sincronizzaPuntiFedelta(appt);
  log(`Appuntamento inserito dallo staff: ${nomeVisualizzato} — ${nomiServizi(servizi)} il ${appt.data} ${appt.ora} con ${getPro(sb.proId).nome}`);
  saveDB();
  staffBooking = null;
  render();
}

function renderAdminStats(){
  const tutti = DB.appts;
  const completati = tutti.filter(a=>a.stato==="Completato");
  const annullati = tutti.filter(a=>a.stato==="Annullato").length;
  const noshow = tutti.filter(a=>a.stato==="No-show").length;
  let incassato = 0, acconti = 0, daIncassareNegozio = 0;
  tutti.forEach(a=>{
    if(!a.pagamento) return;
    if(a.pagamento.tipo==="online") incassato += a.pagamento.importo;
    if(a.pagamento.tipo==="acconto"){
      incassato += a.pagamento.importo;
      acconti += a.pagamento.importo;
      const totaleServizi = prezzoTotale(serviziAppt(a));
      if(totaleServizi) daIncassareNegozio += (totaleServizi - a.pagamento.importo);
    }
  });
  const conteggioServizi = {};
  completati.forEach(a=>{ serviziAppt(a).forEach(s=>{ conteggioServizi[s.name]=(conteggioServizi[s.name]||0)+1; }); });
  const topServizi = Object.entries(conteggioServizi).sort((a,b)=>b[1]-a[1]).slice(0,3);

  let html = `<h2 class="section-title">Statistiche generali</h2>
  <div class="stat-grid">
    <div class="stat"><div class="num">${tutti.length}</div><div class="lbl">Appuntamenti totali</div></div>
    <div class="stat"><div class="num">€${incassato.toFixed(2)}</div><div class="lbl">Incassato online/acconti</div></div>
    <div class="stat"><div class="num">€${daIncassareNegozio.toFixed(2)}</div><div class="lbl">Saldi da incassare in negozio</div></div>
    <div class="stat"><div class="num">${annullati}</div><div class="lbl">Annullamenti</div></div>
    <div class="stat"><div class="num">${noshow}</div><div class="lbl">No-show</div></div>
    <div class="stat"><div class="num">${DB.clients.length}</div><div class="lbl">Clienti totali</div></div>
  </div>
  <h2 class="section-title">Servizi più prenotati</h2>`;
  if(topServizi.length===0) html += `<div class="empty">Nessun dato ancora (nessun appuntamento completato).</div>`;
  else html += `<table class="simple"><tr><th>Servizio</th><th>Volte</th></tr>${topServizi.map(([n,c])=>`<tr><td>${n}</td><td>${c}</td></tr>`).join('')}</table>`;
  return html;
}

function renderCalendarioPersonalizzato(){
  if(!calendarioAperto) return '';
  const oggi = new Date(); oggi.setHours(0,0,0,0);
  const mese = new Date(calendarioAperto.mese+"T00:00:00");
  const anno = mese.getFullYear(), meseNum = mese.getMonth();
  const primoDelMese = new Date(anno, meseNum, 1);
  const giornoSettPrimo = primoDelMese.getDay(); // 0=Dom..6=Sab
  const offsetInizio = giornoSettPrimo===0 ? 6 : giornoSettPrimo-1; // Lun=0
  const giorniNelMese = new Date(anno, meseNum+1, 0).getDate();
  const nomeMese = primoDelMese.toLocaleDateString('it-IT', {month:'long', year:'numeric'});
  const minDate = calendarioAperto.min ? new Date(calendarioAperto.min+"T00:00:00") : null;
  const selezionata = calendarioAperto.valoreAttuale ? new Date(calendarioAperto.valoreAttuale+"T00:00:00") : null;

  let celle = '';
  for(let i=0;i<offsetInizio;i++) celle += `<div class="cal-day empty"></div>`;
  for(let g=1; g<=giorniNelMese; g++){
    const d = new Date(anno, meseNum, g);
    const iso = dataLocaleISO(d);
    const bloccaChiusure = calendarioAperto.campo==='sel-data' || calendarioAperto.campo==='sb-data';
    const disabilitato = (minDate && d < minDate) || (calendarioAperto.escludiGiorni||[]).includes(d.getDay()) || (bloccaChiusure && (DB.chiusure||[]).some(ch=>ch.data===iso));
    const isOggi = d.getTime()===oggi.getTime();
    const isSelezionata = selezionata && d.getTime()===selezionata.getTime();
    celle += `<div class="cal-day ${disabilitato?'disabled':''} ${isOggi?'today':''} ${isSelezionata?'selected':''}" ${disabilitato?'':`data-cal-giorno="${iso}"`}>${g}</div>`;
  }

  return `<div class="cal-overlay" id="cal-overlay">
    <div class="cal-popup">
      <div class="cal-header">
        <button class="cal-nav" id="cal-mese-prev" type="button">‹</button>
        <div class="cal-titolo">${nomeMese}</div>
        <button class="cal-nav" id="cal-mese-next" type="button">›</button>
      </div>
      <div class="cal-weekdays"><div>L</div><div>M</div><div>M</div><div>G</div><div>V</div><div>S</div><div>D</div></div>
      <div class="cal-grid">${celle}</div>
      <div class="cal-footer"><button class="btn ghost small" id="cal-chiudi" type="button">Chiudi</button></div>
    </div>
  </div>`;
}

function apriCalendarioPersonalizzato(campo, min, valoreAttuale, escludiGiorni){
  const base = valoreAttuale || (min && min > oggiISO() ? min : oggiISO());
  calendarioAperto = {campo, min: min||null, valoreAttuale: valoreAttuale||null, escludiGiorni: escludiGiorni||[], mese: base.slice(0,8)+"01"};
  render();
}

function generaPdfCliente(cliente, tipo){
  if(typeof window.jspdf === "undefined"){
    alert("La libreria per generare il PDF non si è caricata (serve connessione internet). Riprova tra poco.");
    return;
  }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  const larghezzaPagina = doc.internal.pageSize.getWidth();
  const altezzaPagina = doc.internal.pageSize.getHeight();
  const margine = 15;
  const larghezzaUtile = larghezzaPagina - margine*2;
  let y = 32;

  function scriviTesto(testo, dimensione, stile){
    doc.setFont("helvetica", stile||"normal");
    doc.setFontSize(dimensione);
    doc.setTextColor(30,30,30);
    const righe = doc.splitTextToSize(testo, larghezzaUtile);
    righe.forEach(riga=>{
      if(y > altezzaPagina - margine){ doc.addPage(); y = margine; }
      doc.text(riga, margine, y);
      y += dimensione*0.42;
    });
  }
  function spazio(mm){ y += mm; }

  doc.setFillColor(214,31,122);
  doc.rect(0,0,larghezzaPagina,22,'F');
  doc.setTextColor(255,255,255);
  doc.setFont("helvetica","bold");
  doc.setFontSize(16);
  doc.text("Nima Hair & Beauty", margine, 14);

  scriviTesto(tipo==="interno" ? "Report interno cliente" : "Riepilogo cliente", 15, "bold");
  spazio(3);
  scriviTesto(`Nome: ${cliente.nome}`, 11);
  if(cliente.telefono) scriviTesto(`Telefono: ${cliente.telefono}`, 11);
  if(cliente.email) scriviTesto(`Email: ${cliente.email}`, 11);
  if(cliente.creato) scriviTesto(`Cliente dal: ${fmtData(cliente.creato.slice(0,10))}`, 11);
  scriviTesto(`Punti fedeltà attuali: ${cliente.punti||0}`, 11, "bold");
  spazio(5);

  scriviTesto("Storico appuntamenti", 13, "bold");
  spazio(2);
  const storico = DB.appts.filter(a=>a.clienteId===cliente.id).sort((a,b)=> (a.data+a.ora) < (b.data+b.ora) ? 1 : -1);
  if(storico.length===0){
    scriviTesto("Nessun appuntamento registrato.", 10.5);
  } else {
    storico.forEach(a=>{
      const servizi = serviziAppt(a);
      const pro = getPro(a.proId);
      scriviTesto(`${fmtData(a.data)} · ${a.ora} — ${nomiServizi(servizi)}`, 11, "bold");
      let riga2 = `Professionista: ${pro?pro.nome:'-'} · Stato: ${a.stato} · Pagamento: ${describePagamento(a)}`;
      if(tipo==="interno" && a.creatoDa) riga2 += ` · Prenotato da: ${a.creatoDa}`;
      scriviTesto(riga2, 10);
      spazio(2);
    });
  }

  if(tipo==="interno" && cliente.note && cliente.note.length){
    spazio(4);
    scriviTesto("Note interne", 13, "bold");
    spazio(2);
    cliente.note.forEach(n=>{
      scriviTesto(`— ${n.testo} (${n.proNome||''}, ${n.data?fmtData(n.data.slice(0,10)):''})`, 10);
    });
  }

  const numPagine = doc.internal.getNumberOfPages();
  for(let p=1;p<=numPagine;p++){
    doc.setPage(p);
    doc.setFont("helvetica","normal");
    doc.setFontSize(8.5);
    doc.setTextColor(120,120,120);
    doc.text("Nima Hair & Beauty (Pionico Group S.r.l.s.) — Via Roma 163, Bellizzi (SA) — P.IVA 06224290657", margine, altezzaPagina-8);
    doc.text(`Generato il ${new Date().toLocaleDateString('it-IT')} · Pag. ${p}/${numPagine}`, larghezzaPagina-margine, altezzaPagina-8, {align:'right'});
  }

  const nomeFile = `${tipo==="interno"?"report-interno":"riepilogo"}-${cliente.nome.replace(/\s+/g,'-').toLowerCase()}.pdf`;
  doc.save(nomeFile);
}

async function confermaPrenotazione(){
  const servizi = getServizi(bookingState.serviceIds);
  if(!clienteRecord){ alert("Devi accedere prima di prenotare."); return; }
  const durataComplessiva = durataTotale(servizi);
  const promoAttiva = promoApplicabile(servizi);
  const prezzoComplessivo = prezzoConPromo(servizi, promoAttiva);

  let proId = bookingState.proId;
  if(!proId){
    const disponibili = DB.pros.filter(p=>p.aree.includes(bookingState.area) &&
      !slotOccupato(p.id, bookingState.data, bookingState.ora, durataComplessiva, null));
    proId = disponibili.length ? disponibili[0].id : DB.pros.find(p=>p.aree.includes(bookingState.area)).id;
  }
  if(slotOccupato(proId, bookingState.data, bookingState.ora, durataComplessiva, null)){
    alert("Questo orario è appena stato occupato, scegline un altro.");
    render();
    return;
  }

  let pagamento = null;
  if(promoAttiva && promoAttiva.pagamentoObbligatorio){
    pagamento = {tipo:"online", importo:prezzoComplessivo, stato:"in_attesa"};
  } else if(prezzoComplessivo > 30){
    const scelta = prompt(`Totale superiore a €30. Scrivi "50" per versare un acconto del 50% (€${calcolaAcconto(prezzoComplessivo)}) oppure "saldo" per pagare subito l'intero importo (€${prezzoComplessivo}):`, "50");
    if(scelta==="saldo") pagamento = {tipo:"online", importo:prezzoComplessivo, stato:"in_attesa"};
    else if(scelta==="50") pagamento = {tipo:"acconto", importo:calcolaAcconto(prezzoComplessivo), stato:"in_attesa"};
    else { alert("Devi scegliere una modalità di pagamento per confermare."); return; }
  }

  const cliente = clienteRecord;
  const appt = {
    id: uid("a"),
    clienteId: cliente.id,
    area: bookingState.area,
    serviceId: bookingState.serviceIds[0],
    serviceIds: bookingState.serviceIds.slice(),
    proId,
    data: bookingState.data,
    ora: bookingState.ora,
    stato: "Confermato",
    creatoDa: "Cliente (online)",
    pagamento,
    promoId: promoAttiva ? promoAttiva.id : null,
    prezzoPromo: promoAttiva ? prezzoComplessivo : null,
    creato: adessoISO()
  };
  DB.appts.push(appt);
  log(`Nuova prenotazione: ${cliente.nome} — ${nomiServizi(servizi)} il ${appt.data} ${appt.ora} con ${getPro(proId).nome}${promoAttiva?` (promo: ${promoAttiva.nome})`:''}`);
  await saveDB();
  bookingState = {area:null, serviceIds:[], proId:null, data:null, ora:null};
  vistaClienteTab = "storico";

  if(pagamento && pagamento.stato==="in_attesa"){
    render();
    await avviaPagamentoSumUp(appt, pagamento, nomiServizi(servizi));
  } else {
    render();
    alert("Prenotazione confermata! Ti aspettiamo.");
  }
}

async function avviaPagamentoSumUp(appt, pagamento, descrizioneServizio){
  try{
    const redirectUrl = location.origin + location.pathname + `?pagamento=ritorno&appt=${appt.id}`;
    const riferimentoTentativo = `${appt.id}-${Date.now()}`;
    const resp = await fetch("/.netlify/functions/crea-pagamento", {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({
        importo: pagamento.importo,
        descrizione: `${descrizioneServizio} — Nima Hair & Beauty`,
        riferimento: riferimentoTentativo,
        redirectUrl
      })
    });
    const data = await resp.json();
    if(!resp.ok || !data.url){
      throw new Error((data && data.error) ? JSON.stringify(data.error) : "Risposta non valida dal server di pagamento");
    }
    appt.pagamento.sumupCheckoutId = data.id;
    await saveDB();
    window.location.href = data.url;
  } catch(e){
    console.error("Errore avvio pagamento SumUp", e);
    alert("Prenotazione salvata, ma non è stato possibile aprire la pagina di pagamento (" + e.message + "). Potrai pagare in negozio, oppure riprova più tardi dai \"Miei appuntamenti\".");
    render();
  }
}

async function verificaPagamentoDiRitorno(apptId){
  const appt = DB.appts.find(a=>a.id===apptId);
  if(!appt || !appt.pagamento || !appt.pagamento.sumupCheckoutId) return;
  if(appt.pagamento.stato !== "in_attesa") return; // già verificato in precedenza
  try{
    const resp = await fetch(`/.netlify/functions/stato-pagamento?id=${encodeURIComponent(appt.pagamento.sumupCheckoutId)}`);
    const data = await resp.json();
    if(data.status === "PAID"){
      appt.pagamento.stato = "confermato";
      sincronizzaPuntiFedelta(appt);
      log(`Pagamento SumUp confermato per appuntamento ${appt.data} ${appt.ora}`);
      alert("Pagamento ricevuto, grazie! La tua prenotazione è confermata.");
    } else if(data.status === "FAILED" || data.status === "EXPIRED"){
      appt.pagamento.stato = "fallito";
      alert("Il pagamento non è andato a buon fine. Puoi riprovare dai \"Miei appuntamenti\", oppure pagare in negozio.");
    } else {
      alert("Il pagamento risulta ancora in sospeso. Se hai già pagato, il saldo verrà confermato a breve.");
    }
    await saveDB();
    render();
  } catch(e){
    console.error("Errore verifica pagamento", e);
  }
}

// Gestione del ritorno dalla pagina di pagamento SumUp (Hosted Checkout)
(function gestisciRitornoPagamento(){
  const params = new URLSearchParams(location.search);
  if(params.get("pagamento") === "ritorno" && params.get("appt")){
    const apptId = params.get("appt");
    currentRole = "cliente";
    vistaClienteTab = "storico";
    // Aspetta che DB sia caricato da Firestore prima di verificare
    const attendiDB = setInterval(()=>{
      if(DB){
        clearInterval(attendiDB);
        verificaPagamentoDiRitorno(apptId);
      }
    }, 300);
    // Pulisce l'indirizzo dalla query string
    history.replaceState({}, "", location.pathname);
  }
})();
